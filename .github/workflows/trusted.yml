name: trusted
on:
  workflow_run:
    workflows: [pr-stub]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow_run fields (no secrets, no checkout)
        env:
          WR: ${{ toJSON(github.event.workflow_run) }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
          TRIG: ${{ github.triggering_actor }}
        run: |
          echo "$WR" | jq -c '{name, path, event, conclusion, head_branch, head_sha,
            head_repo: .head_repository.full_name, actor: .actor.login,
            triggering_actor: .triggering_actor.login, display_title, prs: (.pull_requests | length)}'
          echo "sender=$SENDER github.actor=$ACTOR github.triggering_actor=$TRIG"
      - name: Resolve PR (any state) by head sha from API
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/pulls?head=${OWNER}:${BRANCH}&state=all" \
            --jq ".[] | select(.head.sha == \"$WR_SHA\") | {number, state, merged_at, author: .user.login, labels: [.labels[].name]}"
          for n in $(gh api "repos/${{ github.repository }}/pulls?head=${OWNER}:${BRANCH}&state=all" --jq ".[] | select(.head.sha == \"$WR_SHA\" and .state == \"closed\") | .number"); do
            echo "PR $n close events:"
            gh api "repos/${{ github.repository }}/issues/$n/events" --jq '.[] | select(.event == "closed" or .event == "merged") | {event, actor: .actor.login, created_at}'
            gh api "repos/${{ github.repository }}/pulls/$n" --jq '{merged, merged_by: .merged_by.login}'
          done
